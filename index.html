<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<title>FishFlow - 闲鱼无货源助手</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;text-decoration:none}
.btn-primary{background:#0c8ee7;color:#fff}.btn-primary:active{background:#0070c4}
.btn-red{background:#ef4444;color:#fff}.btn-red:active{background:#dc2626}
.btn-ghost{background:#fff;color:#0c8ee7;border:1.5px solid #0c8ee7}.btn-ghost:active{background:#f0f7ff}
.btn-sm{padding:6px 12px;font-size:12px}
input,select{width:100%;padding:10px 14px;border:1.5px solid #dde1e6;border-radius:8px;font-size:14px;outline:none;background:#fff;font-family:inherit}
input:focus,select:focus{border-color:#0c8ee7;box-shadow:0 0 0 3px rgba(12,142,231,.1)}
label{font-size:13px;font-weight:600;color:#475569;display:block;margin-bottom:4px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.bg-green{background:#ecfdf5;color:#059669}.bg-yellow{background:#fffbeb;color:#d97706}
.bg-blue{background:#eff6ff;color:#2563eb}.bg-red{background:#fef2f2;color:#dc2626}
.stat-num{font-size:26px;font-weight:700}.stat-lbl{font-size:13px;color:#94a3b8;margin-top:4px}
.toast{position:fixed;top:20px;right:20px;z-index:999;padding:12px 20px;border-radius:10px;color:#fff;font-size:14px;font-weight:600;animation:slideIn .3s;max-width:300px}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.hidden{display:none!important}
.tab-btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:#64748b}
.tab-btn.active{background:#eff6ff;color:#0c8ee7;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:8px;color:#64748b;font-size:14px;font-weight:500;cursor:pointer;border:none;background:none;width:100%}
.nav-item:hover,.nav-item.active{background:#eff6ff;color:#0c8ee7;font-weight:600}
#login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0c8ee7,#004a8f);padding:20px}
#login-box{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:36px 28px}
#app-layout{display:flex;min-height:100vh}
#sidebar{width:240px;min-width:240px;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
#main-area{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
#content{padding:20px;flex:1;overflow-y:auto}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat-card{padding:18px;display:flex;align-items:center;justify-content:space-between}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:768px){
  #sidebar{display:none}
  #sidebar.open{display:flex;position:fixed;top:0;left:0;bottom:0;z-index:50;box-shadow:4px 0 20px rgba(0,0,0,.1)}
  .form-row{grid-template-columns:1fr}
}
.mobile-menu{display:none}
@media(max-width:768px){.mobile-menu{display:flex}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:#94a3b8;border-bottom:2px solid #e2e8f0}
td{padding:10px 12px;border-bottom:1px solid #f1f5f9}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:520px;max-height:85vh;overflow-y:auto}
.chart-bar-wrap{display:flex;align-items:flex-end;gap:8px;height:160px;padding:0 4px}
.chart-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.chart-bar{width:100%;max-width:36px;border-radius:6px 6px 0 0;min-height:4px}
.plan-card{padding:20px;border:2px solid #e2e8f0;border-radius:12px;cursor:pointer;position:relative}
.plan-card.selected{border-color:#0c8ee7}
.plan-card .check{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:#0c8ee7;display:none;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.plan-card.selected .check{display:flex}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.confirm-box{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:380px;text-align:center}
.confirm-box h3{font-size:17px;font-weight:700;margin-bottom:10px}
.confirm-box p{font-size:14px;color:#64748b;margin-bottom:20px}
.confirm-box .btn-row{display:flex;gap:10px;justify-content:center}
</style>
</head>
<body>

<!-- Login Page -->
<div id="login-page">
  <div id="login-box">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:34px;font-weight:800;color:#0c8ee7">🐟 FishFlow</div>
      <div style="color:#94a3b8;font-size:14px;margin-top:4px">闲鱼无货源助手</div>
    </div>
    <h2 id="login-title" style="font-size:20px;font-weight:700;margin-bottom:20px;color:#1e293b">欢迎回来</h2>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div id="reg-name-field" class="hidden"><label>用户名</label><input id="reg-name" maxlength="20" placeholder="输入用户名" autocomplete="off"></div>
      <div><label>邮箱</label><input id="login-email" type="email" maxlength="100" placeholder="your@email.com" autocomplete="email"></div>
      <div><label>密码</label><input id="login-pw" type="password" maxlength="64" placeholder="输入密码（至少6位）" autocomplete="current-password"></div>
      <div id="login-error" style="display:none;padding:8px 12px;background:#fef2f2;color:#dc2626;border-radius:8px;font-size:13px"></div>
      <button class="btn btn-primary" id="login-btn" onclick="doLogin()" style="margin-top:4px">登录</button>
    </div>
    <div style="text-align:center;margin-top:18px;font-size:13px;color:#94a3b8">
      <span id="toggle-text">没有账号？</span><span id="toggle-btn" style="color:#0c8ee7;cursor:pointer;font-weight:600;margin-left:4px" onclick="toggleReg()">立即注册</span>
    </div>
    <div style="margin-top:14px;padding:10px;background:#f8fafc;border-radius:8px;font-size:12px;color:#94a3b8;text-align:center">🔒 数据存储在浏览器本地 · 密码加密存储</div>
  </div>
</div>

<!-- App -->
<div id="app-layout" class="hidden">
  <div id="sidebar">
    <div style="padding:18px 20px 14px;border-bottom:1px solid #e2e8f0">
      <div style="font-size:20px;font-weight:800;color:#0c8ee7">🐟 FishFlow</div>
      <div style="font-size:12px;color:#94a3b8">闲鱼无货源助手</div>
    </div>
    <div style="flex:1;padding:10px;display:flex;flex-direction:column;gap:2px">
      <button class="nav-item active" data-page="dash">📊 工作台</button>
      <button class="nav-item" data-page="prod">📦 商品绑定</button>
      <button class="nav-item" data-page="ord">🛒 订单管理</button>
      <button class="nav-item" data-page="ana">📈 利润分析</button>
      <button class="nav-item" data-page="set">⚙️ 系统设置</button>
    </div>
    <div style="padding:10px;border-top:1px solid #e2e8f0">
      <button class="nav-item" onclick="logout()" style="color:#ef4444">🚪 退出登录</button>
    </div>
  </div>
  <div id="sidebar-mask" style="display:none;position:fixed;inset:0;z-index:49" onclick="toggleSidebar()"></div>
  <div id="main-area">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="mobile-menu btn-ghost btn-sm" onclick="toggleSidebar()">☰</button>
        <span id="page-title" style="font-size:17px;font-weight:700;color:#1e293b">工作台</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span id="plan-badge" class="badge bg-blue">免费版</span>
        <div id="user-avatar" style="width:30px;height:30px;border-radius:50%;background:#eff6ff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#0c8ee7"></div>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<script>
// ===== SECURITY HELPERS =====
// HTML内容转义（防XSS）
function esc(s){if(s==null)return'';const d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
// HTML属性转义（防属性注入XSS）
function escAttr(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
// 密码哈希（SHA-256 + 盐）
async function hashPw(pw){const enc=new TextEncoder().encode(pw+'_fishflow_v1_salt_');const buf=await crypto.subtle.digest('SHA-256',enc);return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}
// 邮箱格式校验
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)}
// 手机号格式校验（中国大陆）
function validPhone(p){return /^1[3-9]\d{9}$/.test(p)}
// 手机号脱敏
function maskPhone(p){if(!p||p.length<7)return p||'';return p.slice(0,3)+'****'+p.slice(-4)}
// 输入清洗（去除危险字符，限制长度）
function sanitize(s,maxLen){if(!s)return'';s=String(s).trim();if(maxLen)s=s.slice(0,maxLen);return s}

// ===== LOGIN RATE LIMITING =====
let loginAttempts=0;
let lockUntil=0;
function isLocked(){return Date.now()<lockUntil}
function getLockRemaining(){return Math.ceil((lockUntil-Date.now())/1000)}

// ===== DATA =====
const K='fishflow_db';
function getDB(){
  try{
    const raw=localStorage.getItem(K);
    if(!raw)return{user:null,products:[],orders:[]};
    const d=JSON.parse(raw);
    // 数据结构完整性校验
    if(typeof d!=='object'||d===null)return{user:null,products:[],orders:[]};
    if(!Array.isArray(d.products))d.products=[];
    if(!Array.isArray(d.orders))d.orders=[];
    return d;
  }catch(e){
    console.warn('FishFlow: localStorage数据损坏，已重置');
    return{user:null,products:[],orders:[]};
  }
}
function saveDB(db){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('存储空间不足，请导出数据后清理','err')}}

let currentUser=null;
let currentPage='dash';
let isReg=false;
// AI优化去重：记录已请求的标题，避免重复调用
const aiRequestedTitles=new Set();

// ===== TOAST =====
function toast(msg,type){
  const t=document.createElement('div');t.className='toast';
  t.style.background=type==='ok'?'#059669':type==='err'?'#dc2626':'#2563eb';
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

// ===== CUSTOM CONFIRM (替代原生confirm，防钓鱼) =====
function customConfirm(title,msg,onConfirm){
  const overlay=document.createElement('div');overlay.className='confirm-overlay';
  overlay.innerHTML=`<div class="confirm-box"><h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="btn-row"><button class="btn btn-ghost" id="cc-cancel">取消</button><button class="btn btn-red" id="cc-ok">确认</button></div></div>`;
  document.body.appendChild(overlay);
  document.getElementById('cc-cancel').onclick=()=>overlay.remove();
  document.getElementById('cc-ok').onclick=()=>{overlay.remove();onConfirm()};
  overlay.addEventListener('click',(e)=>{if(e.target===overlay)overlay.remove()});
}

// ===== LOGIN =====
function toggleReg(){
  isReg=!isReg;
  document.getElementById('login-title').textContent=isReg?'创建账号':'欢迎回来';
  document.getElementById('toggle-text').textContent=isReg?'已有账号？':'没有账号？';
  document.getElementById('toggle-btn').textContent=isReg?'立即登录':'立即注册';
  document.getElementById('reg-name-field').classList.toggle('hidden',!isReg);
  document.getElementById('login-btn').textContent=isReg?'注册':'登录';
  hideLoginError();
}

function showLoginError(msg){
  const el=document.getElementById('login-error');
  el.textContent=msg;el.style.display='block';
}
function hideLoginError(){
  document.getElementById('login-error').style.display='none';
}

async function doLogin(){
  hideLoginError();
  // 登录频率限制
  if(isLocked()){
    showLoginError('操作过于频繁，请 '+getLockRemaining()+' 秒后重试');
    return;
  }
  const em=sanitize(document.getElementById('login-email').value.trim(),100);
  const pw=document.getElementById('login-pw').value;
  const nm=sanitize(document.getElementById('reg-name').value.trim(),20);

  // 输入校验
  if(!em||!pw){showLoginError('请填写邮箱和密码');return}
  if(!validEmail(em)){showLoginError('邮箱格式不正确');return}
  if(pw.length<6){showLoginError('密码至少6位');return}

  if(isReg){
    // 注册流程
    if(!nm){showLoginError('请输入用户名');return}
    if(nm.length<2){showLoginError('用户名至少2个字符');return}
    const db=getDB();
    if(db.user&&db.user.email===em){showLoginError('该邮箱已注册，请直接登录');return}
    const pwHash=await hashPw(pw);
    const u={id:Date.now(),name:nm,email:em,pwHash:pwHash,plan:'free',createdAt:new Date().toISOString()};
    db.user=u;saveDB(db);
    currentUser={...u};delete currentUser.pwHash;
    toast('注册成功！','ok');showApp();
  }else{
    // 登录流程
    const db=getDB();
    if(!db.user||db.user.email!==em){
      loginAttempts++;
      if(loginAttempts>=5){lockUntil=Date.now()+60000;showLoginError('连续失败5次，请1分钟后重试')}
      else showLoginError('邮箱或密码错误');
      return;
    }
    const pwHash=await hashPw(pw);
    if(db.user.pwHash&&db.user.pwHash!==pwHash){
      loginAttempts++;
      if(loginAttempts>=5){lockUntil=Date.now()+60000;showLoginError('连续失败5次，请1分钟后重试')}
      else showLoginError('邮箱或密码错误');
      return;
    }
    // 登录成功，重置计数
    loginAttempts=0;
    currentUser={...db.user};delete currentUser.pwHash;
    toast('登录成功！','ok');showApp();
  }
}

function logout(){
  currentUser=null;
  const db=getDB();db.user=null;saveDB(db);
  document.getElementById('app-layout').classList.add('hidden');
  document.getElementById('login-page').classList.remove('hidden');
  document.getElementById('login-email').value='';
  document.getElementById('login-pw').value='';
  document.getElementById('reg-name').value='';
  hideLoginError();
}

// ===== NAV =====
function showApp(){
  document.getElementById('login-page').classList.add('hidden');
  document.getElementById('app-layout').classList.remove('hidden');
  document.getElementById('user-avatar').textContent=(currentUser.name||'U').charAt(0).toUpperCase();
  document.getElementById('plan-badge').textContent=currentUser.plan==='free'?'免费版':currentUser.plan==='pro'?'Pro版':'工作室版';
  document.getElementById('plan-badge').className='badge '+(currentUser.plan==='free'?'bg-blue':currentUser.plan==='pro'?'bg-yellow':'bg-green');
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-mask').style.display='none';
  navTo('dash');
}

function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const mask=document.getElementById('sidebar-mask');
  sb.classList.toggle('open');
  mask.style.display=sb.classList.contains('open')?'block':'none';
}

document.querySelectorAll('.nav-item[data-page]').forEach(btn=>{
  btn.addEventListener('click',function(){navTo(this.dataset.page)});
});

function navTo(page){
  currentPage=page;
  document.querySelectorAll('.nav-item[data-page]').forEach(b=>b.classList.remove('active'));
  const btn=document.querySelector('.nav-item[data-page="'+page+'"]');
  if(btn)btn.classList.add('active');
  const titles={dash:'工作台',prod:'商品绑定',ord:'订单管理',ana:'利润分析',set:'系统设置'};
  document.getElementById('page-title').textContent=titles[page]||page;
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-mask').style.display='none';
  renderPage(page);
}

// ===== RENDER =====
function renderPage(page){
  const c=document.getElementById('content');
  if(page==='dash')c.innerHTML=dashHTML();
  else if(page==='prod')c.innerHTML=prodHTML();
  else if(page==='ord')c.innerHTML=ordHTML();
  else if(page==='ana')c.innerHTML=anaHTML();
  else if(page==='set')c.innerHTML=setHTML();
  bindEvents(page);
}

// ===== DASHBOARD =====
function dashHTML(){
  const db=getDB();
  const ps=db.products||[],os=db.orders||[];
  const tp=ps.reduce((s,p)=>s+(p.profit||0),0);
  const po=os.filter(o=>o.status==='pending').length;
  const stats=[
    {l:'绑定商品',v:ps.length,c:'#0c8ee7',b:'#eff6ff',i:'📦'},
    {l:'总订单',v:os.length,c:'#8b5cf6',b:'#f5f3ff',i:'🛒'},
    {l:'累计利润',v:'¥'+tp.toFixed(2),c:'#059669',b:'#ecfdf5',i:'💰'},
    {l:'待处理',v:po,c:'#f59e0b',b:'#fffbeb',i:'⏳'},
  ];
  const ro=[...os].reverse().slice(0,5);
  let rows='';
  ro.forEach(o=>{
    const sl=o.status==='done'?'已完成':o.status==='pending'?'待处理':'处理中';
    const sc=o.status==='done'?'bg-green':o.status==='pending'?'bg-yellow':'bg-blue';
    rows+=`<tr><td style="font-family:monospace;font-size:12px">#${String(o.id).slice(-6)}</td><td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.productTitle)}</td><td style="font-weight:600">¥${Number(o.salePrice||0).toFixed(2)}</td><td style="color:#059669;font-weight:600">+¥${(o.profit||0).toFixed(2)}</td><td><span class="badge ${sc}">${sl}</span></td><td style="color:#94a3b8;font-size:12px">${o.createdAt?new Date(o.createdAt).toLocaleDateString('zh-CN'):'-'}</td></tr>`;
  });
  let h='<div class="stat-grid">';
  stats.forEach(s=>h+=`<div class="card stat-card"><div><div class="stat-num" style="color:${s.c}">${s.v}</div><div class="stat-lbl">${s.l}</div></div><div style="font-size:28px">${s.i}</div></div>`);
  h+='</div><div class="card" style="padding:18px"><h3 style="font-size:16px;font-weight:700;margin-bottom:14px">📋 最近订单</h3>';
  if(ro.length===0)h+='<div style="text-align:center;padding:40px;color:#94a3b8">📭 暂无订单数据</div>';
  else h+='<div style="overflow-x:auto"><table><thead><tr><th>编号</th><th>商品</th><th>金额</th><th>利润</th><th>状态</th><th>时间</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  h+='</div>';
  return h;
}

// ===== PRODUCTS =====
function prodHTML(){
  const db=getDB();
  const ps=db.products||[];
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
    <span style="font-size:14px;color:#94a3b8">已绑定 <b style="color:#0c8ee7">${ps.length}</b> 个商品</span>
    <button class="btn btn-primary" onclick="openProdModal()">+ 绑定新商品</button></div>`;
  if(ps.length===0){
    h+=`<div class="card" style="text-align:center;padding:50px">
      <div style="font-size:44px;margin-bottom:10px">📦</div>
      <div style="font-size:16px;font-weight:600;color:#475569;margin-bottom:6px">还没有绑定商品</div>
      <div style="font-size:13px;color:#94a3b8;margin-bottom:18px">绑定拼多多/淘宝商品与闲鱼链接，自动计算利润</div>
      <button class="btn btn-primary" onclick="openProdModal()">开始绑定</button></div>`;
  }else{
    ps.forEach(p=>{
      const rl=p.riskLevel==='low'?'bg-green':p.riskLevel==='medium'?'bg-yellow':'bg-red';
      const rn=p.riskLevel==='low'?'低风险':p.riskLevel==='medium'?'中风险':'高风险';
      const pl=p.sourcePlatform==='pinduoduo'?'bg-red':p.sourcePlatform==='taobao'?'bg-yellow':'bg-blue';
      const pn=p.sourcePlatform==='pinduoduo'?'拼多多':p.sourcePlatform==='taobao'?'淘宝':'1688';

function anaHTML(){
  const db=getDB();const ps=db.products||[],os=db.orders||[];
  const dn=os.filter(o=>o.status==='done').length;
  const tr=os.reduce((s,o)=>s+(o.salePrice||0),0);
  const realProfit=os.filter(o=>o.status==='done').reduce((s,o)=>s+(o.profit||0),0);
  // Build monthly data from real orders
  const monthMap={};
  const now=new Date();
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const label=(d.getMonth()+1)+'月';
    monthMap[key]={m:label,p:0,n:0};
  }
  os.forEach(o=>{
    if(!o.createdAt)return;
    const od=new Date(o.createdAt);
    const key=od.getFullYear()+'-'+String(od.getMonth()+1).padStart(2,'0');
    if(monthMap[key]){monthMap[key].n++;if(o.status==='done')monthMap[key].p+=o.profit||0}
  });
  const md=Object.values(monthMap);
  const hasData=md.some(d=>d.n>0||d.p>0);
  const mp=Math.max(...md.map(d=>d.p),1);const mn=Math.max(...md.map(d=>d.n),1);

  h+=`<div class="card" style="padding:16px;margin-bottom:16px"><h3 style="font-size:15px;font-weight:700;margin-bottom:12px">🏷️ 商品利润排行</h3>`;

// AI标题优化 - 通过data属性读取标题，避免XSS
async function optimizeTitle(elId,forceTitle){
  const el=document.getElementById(elId);
  if(!el)return;
  const origTitle=forceTitle||el.dataset.title||'';
  if(!origTitle){el.innerHTML='<span style="color:#94a3b8">无标题可优化</span>';return}
  // 去重：同一个标题不重复请求（除非强制刷新）
  if(!forceTitle&&aiRequestedTitles.has(origTitle)){return}
  aiRequestedTitles.add(origTitle);
  el.innerHTML='<span style="color:#94a3b8;font-weight:400">✨ 生成中...</span>';
  try{
    const res=await fetch('/.netlify/functions/optimize',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title:origTitle.slice(0,100)})
    });
    if(!res.ok)throw new Error('请求失败');
    const data=await res.json();
    const aiTitle=data.choices&&data.choices[0]&&data.choices[0].message?data.choices[0].message.content.trim():'';
    if(aiTitle){
      el.textContent=aiTitle; // textContent 防XSS
    }else{
      el.innerHTML='<span style="color:#ef4444">生成失败，点击重试</span>';
    }
  }catch(e){
    el.innerHTML='<span style="color:#ef4444">网络错误，点击重试</span>';
  }
}

  const db=getDB();const ps=db.products||[],os=db.orders||[];
  const plans=[{id:'free',n:'免费版',p:'0',f:['商品绑定 (限5个)','手动订单管理','基础利润计算']},{id:'pro',n:'Pro版',p:'39',f:['无限商品绑定','订单自动检测','AI标题优化','物流同步','一键代拍']},{id:'studio',n:'工作室版',p:'99',f:['Pro版全部功能','多账号管理','数据导出','优先支持','API接口']}];
  let h=`<h2 style="font-size:19px;font-weight:700;margin-bottom:18px">💳 套餐管理</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:28px">`;
  plans.forEach(p=>{
    const sel=currentUser.plan===p.id;
    h+=`<div class="plan-card${sel?' selected':''}" onclick="switchPlan('${p.id}')">
      <div class="check">✓</div>
      <div style="font-size:17px;font-weight:700;margin-bottom:4px">${esc(p.n)}</div>
      <div style="margin-bottom:12px"><span style="font-size:26px;font-weight:800;color:#0c8ee7">¥${esc(p.p)}</span><span style="font-size:13px;color:#94a3b8">/月</span></div>
      ${p.f.map(f=>`<div style="display:flex;align-items:center;gap:5px;font-size:13px;color:#475569;padding:3px 0"><span style="color:#22c55e">✓</span>${esc(f)}</div>`).join('')}
    </div>`;
  });
  h+=`</div>
    <div class="card" style="padding:18px">
      <h3 style="font-size:16px;font-weight:700;margin-bottom:14px">⚙️ 系统设置</h3>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9">
        <div><div style="font-weight:600;font-size:14px">用户信息</div><div style="font-size:12px;color:#94a3b8">${esc(currentUser.name)} · ${esc(currentUser.email)}</div></div>
        <span class="badge bg-blue">当前：${currentUser.plan==='free'?'免费版':currentUser.plan==='pro'?'Pro版':'工作室版'}</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9">
        <div><div style="font-weight:600;font-size:14px">数据统计</div><div style="font-size:12px;color:#94a3b8">${ps.length} 商品 · ${os.length} 订单</div></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9">
        <div><div style="font-weight:600;font-size:14px">📥 导出数据</div><div style="font-size:12px;color:#94a3b8">导出所有商品和订单为JSON文件</div></div>
        <button class="btn btn-primary btn-sm" onclick="exportData()">导出</button></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9">
        <div><div style="font-weight:600;font-size:14px">📤 导入数据</div><div style="font-size:12px;color:#94a3b8">从JSON文件恢复数据（会合并，不覆盖）</div></div>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('import-file').click()">选择文件</button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0">
        <div><div style="font-weight:600;font-size:14px;color:#ef4444">清除数据</div><div style="font-size:12px;color:#94a3b8">删除所有商品和订单数据</div></div>
        <button class="btn btn-red btn-sm" onclick="clearAll()">清除</button></div></div>
    <div style="margin-top:18px;padding:14px;background:#fffbeb;border-radius:8px;font-size:13px;color:#92400e;display:flex;align-items:flex-start;gap:8px">
      <span>🛡️</span><div><b>安全提示：</b>密码经加密存储，手机号自动脱敏显示。本系统仅作为电商辅助工具，不参与实际交易。请遵守各平台规则，合理使用。</div></div>`;
  return h;
}

function switchPlan(id){
  currentUser.plan=id;const db=getDB();db.user={...db.user,plan:id};saveDB(db);
  document.getElementById('plan-badge').textContent=id==='free'?'免费版':id==='pro'?'Pro版':'工作室版';
  document.getElementById('plan-badge').className='badge '+(id==='free'?'bg-blue':id==='pro'?'bg-yellow':'bg-green');
  toast('已切换至 '+(id==='free'?'免费版':id==='pro'?'Pro版':'工作室版'),'ok');navTo('set');
}

function clearAll(){
  customConfirm('清除所有数据','确定清除所有商品和订单数据？此操作不可恢复！',()=>{
    saveDB({user:{...currentUser,pwHash:getDB().user?.pwHash},products:[],orders:[]});
    toast('数据已清除');navTo('set');
  });
}

function exportData(){
  const db=getDB();
  // 导出时去掉密码哈希
  const exportDb={...db,user:{...db.user}};
  delete exportDb.user.pwHash;
  const blob=new Blob([JSON.stringify(exportDb,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='fishflow_backup_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(a.href);toast('数据已导出！','ok');
}

function importData(e){
  const file=e.target.files[0];if(!file)return;
  // 限制文件大小 1MB
  if(file.size>1048576){toast('文件过大（超过1MB）','err');return}
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const imported=JSON.parse(ev.target.result);
      if(!imported.products||!imported.orders){toast('文件格式不正确','err');return}
      const db=getDB();
      const existIds=new Set(db.products.map(p=>p.id));
      let newP=0,newO=0;
      imported.products.forEach(p=>{
        // 校验每条数据的完整性
        if(p.id&&p.sourceTitle&&p.xianyuTitle&&!existIds.has(p.id)){
          db.products.push({id:Number(p.id),sourceUrl:sanitize(p.sourceUrl,500),sourceTitle:sanitize(p.sourceTitle,100),sourcePrice:Number(p.sourcePrice)||0,sourcePlatform:p.sourcePlatform||'pinduoduo',xianyuUrl:sanitize(p.xianyuUrl,500),xianyuTitle:sanitize(p.xianyuTitle,100),xianyuPrice:Number(p.xianyuPrice)||0,freight:Number(p.freight)||0,profit:Number(p.profit)||0,profitRate:p.profitRate||'0',riskLevel:p.riskLevel||'high',status:p.status||'active',createdAt:p.createdAt||new Date().toISOString()});
          newP++;
        }
      });
      const existOids=new Set(db.orders.map(o=>o.id));
      imported.orders.forEach(o=>{
        if(o.id&&o.productTitle&&!existOids.has(o.id)){
          db.orders.push({id:Number(o.id),productId:Number(o.productId)||0,productTitle:sanitize(o.productTitle,100),buyerName:sanitize(o.buyerName,20),buyerPhone:sanitize(o.buyerPhone,11),buyerAddress:sanitize(o.buyerAddress,200),salePrice:Number(o.salePrice)||0,profit:Number(o.profit)||0,status:o.status||'pending',sourceUrl:sanitize(o.sourceUrl,500),sourcePlatform:o.sourcePlatform||'',logisticsCompany:sanitize(o.logisticsCompany,20),logisticsNo:sanitize(o.logisticsNo,30),createdAt:o.createdAt||new Date().toISOString()});
          newO++;
        }
      });
      saveDB(db);toast('导入成功！新增 '+newP+' 商品、'+newO+' 订单','ok');navTo('set');
    }catch(err){toast('导入失败：文件解析错误','err')}
  };
  reader.readAsText(file);
  e.target.value='';
}

// ===== INIT =====
function bindEvents(page){
  if(page==='ord'){window._ordFilter='all'}
  if(page==='ana'){
    // 延迟触发AI优化（使用data属性获取标题，避免重复请求）
    setTimeout(()=>{
      document.querySelectorAll('[data-ai-btn]').forEach(btn=>{
        const targetId=btn.dataset.aiBtn;
        const targetEl=document.getElementById(targetId);
        if(targetEl&&targetEl.querySelector('span')){
          optimizeTitle(targetId);
        }
      });
    },500);
    // AI重新生成按钮
    document.querySelectorAll('[data-ai-btn]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const targetId=btn.dataset.aiBtn;
        const targetEl=document.getElementById(targetId);
        if(targetEl){
          const title=targetEl.dataset.title;
          aiRequestedTitles.delete(title); // 允许重新请求
          optimizeTitle(targetId,title);
        }
      });
    });
  }
}

// Check for existing session
(function(){
  const db=getDB();
  if(db.user&&db.user.email){
    currentUser={...db.user};delete currentUser.pwHash;
    showApp();
  }
})();
</script>
