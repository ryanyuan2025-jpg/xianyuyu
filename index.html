<style>

input:focus,select:focus{border-color:#0c8ee7;box-shadow:0 0 0 3px rgba(12,142,231,.1)}

@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

td{padding:10px 12px;border-bottom:1px solid #f1f5f9}

<script>
// ===== SUPABASE ===== (deploy v2)
const SUPABASE_URL='https://qqybymrxgrhvgxopwjmh.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxeWJ5bXJ4Z3Jodmd4b3B3am1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3Mjg1MzAsImV4cCI6MjA5NjMwNDUzMH0.AAINkWh52KNp2QkAZtOYeODAX3GahziD0x5qL6bgfi0';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// ===== SECURITY HELPERS =====
function esc(s){if(s==null)return'';const d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
function escAttr(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)}
function validPhone(p){return /^1[3-9]\d{9}$/.test(p)}
function maskPhone(p){if(!p||p.length<7)return p||'';return p.slice(0,3)+'****'+p.slice(-4)}
function sanitize(s,maxLen){if(!s)return'';s=String(s).trim();if(maxLen)s=s.slice(0,maxLen);return s}
// 防止在搜索/输入中注入Supabase过滤器语法
function sanitizeSearch(s){return String(s||'').replace(/[.'"\\();,%]/g,'').trim().slice(0,50)}
function validUrl(u){if(!u)return true;try{const url=new URL(u);return['http:','https:'].includes(url.protocol)}catch{return false}}

let currentUser=null;
let currentProfile=null;
let currentPage='dash';
let isReg=false;
const aiRequestedTitles=new Set();
// 防抖：AI请求限频
let lastAiRequest=0;
const AI_COOLDOWN=3000;

// ===== TOAST =====
function toast(msg,type){
  const t=document.createElement('div');t.className='toast';
  t.style.background=type==='ok'?'#059669':type==='err'?'#dc2626':'#2563eb';
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

function customConfirm(title,msg,onConfirm){
  const overlay=document.createElement('div');overlay.className='confirm-overlay';
  overlay.innerHTML='<div class="confirm-box"><h3>'+esc(title)+'</h3><p>'+esc(msg)+'</p><div class="btn-row"><button class="btn btn-ghost" id="cc-cancel">取消</button><button class="btn btn-red" id="cc-ok">确认</button></div></div>';
  document.body.appendChild(overlay);
  document.getElementById('cc-cancel').onclick=()=>overlay.remove();
  document.getElementById('cc-ok').onclick=()=>{overlay.remove();onConfirm()};
  overlay.addEventListener('click',(e)=>{if(e.target===overlay)overlay.remove()});
}

// ===== 自定义输入弹窗（替代 prompt） =====
function customPrompt(title,fields,onConfirm){
  const overlay=document.createElement('div');overlay.className='confirm-overlay';
  let fieldHtml=fields.map(f=>'<div style="margin-bottom:10px"><label>'+esc(f.label)+'</label><input id="cp-'+escAttr(f.id)+'" maxlength="'+(f.maxlen||50)+'" placeholder="'+escAttr(f.placeholder||'')+'" style="width:100%"></div>').join('');
  overlay.innerHTML='<div class="confirm-box" style="text-align:left"><h3 style="text-align:center">'+esc(title)+'</h3>'+fieldHtml+'<div class="btn-row" style="margin-top:16px"><button class="btn btn-ghost" id="cp-cancel">取消</button><button class="btn btn-primary" id="cp-ok">确认</button></div></div>';
  document.body.appendChild(overlay);
  document.getElementById('cp-cancel').onclick=()=>overlay.remove();
  document.getElementById('cp-ok').onclick=()=>{
    const vals={};
    fields.forEach(f=>{vals[f.id]=document.getElementById('cp-'+f.id).value});
    overlay.remove();onConfirm(vals);
  };
  overlay.addEventListener('click',(e)=>{if(e.target===overlay)overlay.remove()});
  // 自动聚焦第一个输入框
  setTimeout(()=>{const first=document.getElementById('cp-'+fields[0].id);if(first)first.focus()},100);
}

// ===== LOGIN =====
function toggleReg(){
  isReg=!isReg;
  document.getElementById('login-title').textContent=isReg?'创建账号':'欢迎回来';
  document.getElementById('toggle-text').textContent=isReg?'已有账号？':'没有账号？';
  document.getElementById('toggle-btn').textContent=isReg?'立即登录':'立即注册';
  document.getElementById('login-form').style.display=isReg?'none':'flex';
  document.getElementById('reg-step1').style.display=isReg?'flex':'none';
  document.getElementById('reg-step2').style.display='none';
  document.getElementById('code-sent-info').style.display='none';
  hideLoginError();
}
function goRegStep1(){
  document.getElementById('reg-step1').style.display='flex';
  document.getElementById('reg-step2').style.display='none';
}
function showRegError(msg){const el=document.getElementById('reg-error');el.textContent=msg;el.style.display='block'}
function hideRegError(){document.getElementById('reg-error').style.display='none'}

// 发送邮箱暗号
let verifyEmail='';
async function sendVerifyCode(){
  hideLoginError();
  const nm=sanitize(document.getElementById('reg-name2').value.trim(),20);
  const em=sanitize(document.getElementById('reg-email').value.trim(),100);
  if(!nm){showLoginError('请输入用户名');return}
  if(nm.length<2){showLoginError('用户名至少2个字符');return}
  if(!em){showLoginError('请输入邮箱');return}
  if(!validEmail(em)){showLoginError('邮箱格式不正确');return}
  
  const btn=document.getElementById('send-code-btn');
  btn.disabled=true;btn.innerHTML='<span class="loading-spinner"></span>发送中...';
  
  try{
    // Check if email already registered
    const{data:existing}=await sb.from('profiles').select('id').eq('email',em).maybeSingle();
    if(existing){showLoginError('该邮箱已注册，请直接登录');btn.disabled=false;btn.textContent='发送暗号';return}
    
    // Generate and store verification code
    const code=String(Math.floor(100000+Math.random()*900000));
    const expiresAt=new Date(Date.now()+5*60*1000).toISOString();
    
    const{error:codeErr}=await sb.from('verify_codes').insert({email:em,code:code,expires_at:expiresAt});
    if(codeErr){showLoginError('发送失败，请稍后重试');btn.disabled=false;btn.textContent='发送暗号';return}
    
    // 调用Netlify Function发送暗号邮件
    try{
      const mailRes=await fetch('/.netlify/functions/send-verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,code:code})});
      const mailData=await mailRes.json();
      if(!mailData.success){showLoginError('暗号邮件发送失败：'+(mailData.detail||mailData.error||'请稍后重试'));btn.disabled=false;btn.textContent='发送暗号';return}
    }catch(mailErr){showLoginError('邮件服务异常，请稍后重试');btn.disabled=false;btn.textContent='发送暗号';return}
    
    verifyEmail=em;
    document.getElementById('code-sent-info').style.display='block';
    document.getElementById('reg-step2').style.display='flex';
    
    toast('✉️ 暗号已发送到 '+em,'ok');
    
    // Countdown on button
    let cd=60;
    btn.disabled=true;
    const timer=setInterval(()=>{cd--;btn.textContent=cd+'秒后重发';if(cd<=0){clearInterval(timer);btn.disabled=false;btn.textContent='重新发送暗号'}},1000);
  }catch(e){
    showLoginError('发送失败：'+(e.message||'网络错误'));
    btn.disabled=false;btn.textContent='发送暗号';
  }
}

// 注册：验证暗号+创建账号
async function doRegister(){
  hideRegError();
  const code=sanitize(document.getElementById('reg-code').value.trim(),6);
  const pw=document.getElementById('reg-pw').value;
  const pw2=document.getElementById('reg-pw2').value;
  const nm=sanitize(document.getElementById('reg-name2').value.trim(),20);
  const em=verifyEmail;
  
  if(!code||code.length!==6){showRegError('请输入6位暗号');return}
  if(!pw||pw.length<6){showRegError('密码至少6位');return}
  if(pw!==pw2){showRegError('两次密码不一致');return}
  
  const btn=document.getElementById('reg-btn');
  btn.disabled=true;btn.innerHTML='<span class="loading-spinner"></span>注册中...';
  
  try{
    // Verify the code
    const{data:codes}=await sb.from('verify_codes')
      .select('*')
      .eq('email',em)
      .eq('code',code)
      .eq('used',false)
      .gte('expires_at',new Date().toISOString())
      .order('created_at',{ascending:false})
      .limit(1);
    
    if(!codes||codes.length===0){showRegError('暗号错误或已过期，请重新获取');btn.disabled=false;btn.textContent='注册';return}
    
    // Mark code as used
    await sb.from('verify_codes').update({used:true}).eq('id',codes[0].id);
    
    // Create account
    const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{name:nm}}});
    if(error){
      if(error.message.includes('already registered')){showRegError('该邮箱已注册，请直接登录')}
      else{showRegError(error.message)}
      btn.disabled=false;btn.textContent='注册';return;
    }
    
    currentUser=data.user;
    await new Promise(r=>setTimeout(r,1500));
    const{data:profile}=await sb.from('profiles').select('*').eq('id',currentUser.id).single();
    currentProfile=profile;
    toast('注册成功！','ok');
    showApp();
  }catch(e){
    showRegError(e.message||'注册失败');
  }finally{
    btn.disabled=false;btn.textContent='注册';
  }
}

function showLoginError(msg){const el=document.getElementById('login-error');el.textContent=msg;el.style.display='block'}
function hideLoginError(){document.getElementById('login-error').style.display='none'}

async function doLogin(){
  hideLoginError();
  const em=sanitize(document.getElementById('login-email').value.trim(),100);
  const pw=document.getElementById('login-pw').value;

  if(!em||!pw){showLoginError('请填写邮箱和密码');return}
  if(!validEmail(em)){showLoginError('邮箱格式不正确');return}
  if(pw.length<6){showLoginError('密码至少6位');return}

  const btn=document.getElementById('login-btn');
  btn.disabled=true;btn.innerHTML='<span class="loading-spinner"></span>登录中...';

  try{
    const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
    if(error)throw error;
    currentUser=data.user;
    const{data:profile}=await sb.from('profiles').select('*').eq('id',currentUser.id).single();
    if(!profile){showLoginError('用户数据异常，请联系管理员');btn.disabled=false;btn.textContent='登录';return}
    if(profile.is_banned){showLoginError('账号已被封禁');await sb.auth.signOut();btn.disabled=false;btn.textContent='登录';return}
    currentProfile=profile;
    await sb.from('profiles').update({last_login:new Date().toISOString()}).eq('id',currentUser.id);
    toast('登录成功！','ok');
    showApp();
  }catch(e){
    const msg=e.message||'操作失败';
    showLoginError(msg.includes('Invalid login')?'邮箱或密码错误':msg.includes('Email not confirmed')?'邮箱未验证，请查看邮箱中的验证链接':msg);
  }finally{
    btn.disabled=false;btn.textContent='登录';
  }
}

// ===== 会话过期检测 =====
async function safeQuery(fn){
  try{
    const result=await fn();
    if(result.error&&result.error.message&&result.error.message.includes('JWT')){
      toast('登录已过期，请重新登录','err');
      setTimeout(()=>logout(),1500);
      return{data:null,error:result.error};
    }
    return result;
  }catch(e){
    if(e.message&&e.message.includes('JWT')){
      toast('登录已过期，请重新登录','err');
      setTimeout(()=>logout(),1500);
    }
    return{data:null,error:e};
  }
}

async function editProd(id){
  const{data:p}=await safeQuery(()=>sb.from('products').select('*').eq('id',id).eq('user_id',currentUser.id).single());

async function saveProd(id){
  const get=(x)=>document.getElementById('pf-'+x).value;
  const st=sanitize(get('st'),100),xt=sanitize(get('xt'),100);
  if(!st||!xt){toast('请填写商品信息','err');return}
  const c=parseFloat(get('sp'))||0;const s=parseFloat(get('xp'))||0;const fr=parseFloat(get('fr'))||0;
  if(c<0||s<0||fr<0){toast('价格不能为负数','err');return}
  // URL格式校验
  const su=get('su'),xu=get('xu');
  if(su&&!validUrl(su)){toast('货源链接格式不正确','err');return}
  if(xu&&!validUrl(xu)){toast('闲鱼链接格式不正确','err');return}
  const pf=s-c-fr;const pr=s>0?((pf/s)*100).toFixed(1):0;
  const d={source_url:sanitize(su,500),source_title:st,source_price:c,source_platform:get('pl'),xianyu_url:sanitize(xu,500),xianyu_title:xt,xianyu_price:s,freight:fr,profit:pf,profit_rate:pr,risk_level:pr>=30?'low':pr>=15?'medium':'high',status:'active'};
  if(id){
    const{error}=await safeQuery(()=>sb.from('products').update(d).eq('id',id).eq('user_id',currentUser.id));
    if(error){toast('更新失败','err');return}
  }else{
    d.user_id=currentUser.id;
    const{error}=await safeQuery(()=>sb.from('products').insert(d));
    if(error){toast('绑定失败','err');return}
  }
  document.querySelector('.modal-overlay').remove();
  toast(id?'商品已更新':'商品绑定成功！','ok');
  loadProd();
}

async function delProd(id){
  customConfirm('删除商品','确定删除该商品？此操作不可恢复。',async()=>{
    await safeQuery(()=>sb.from('products').delete().eq('id',id).eq('user_id',currentUser.id));
    toast('已删除');loadProd();
  });
}

async function saveOrd(){
  const get=(x)=>document.getElementById('of-'+x).value;
  const pi=get('pi'),bn=sanitize(get('bn'),20);
  if(!pi||!bn){toast('请填写必要信息','err');return}
  const phone=sanitize(get('bp'),11);
  if(phone&&!validPhone(phone)){toast('手机号格式不正确','err');return}
  // 免费版每日代拍上限检查
  const plan=currentProfile?.plan||'free';
  if(plan==='free'){
    const today=new Date().toISOString().slice(0,10);
    const{count}=await safeQuery(()=>sb.from('orders').select('*',{count:'exact',head:true}).eq('user_id',currentUser.id).gte('created_at',today+'T00:00:00').lt('created_at',today+'T23:59:59'));
    if(count>=1){toast('免费版每日仅可代拍1单，升级Pro版享无限代拍','err');return}
  }
  const{data:p}=await safeQuery(()=>sb.from('products').select('*').eq('id',parseInt(pi)).eq('user_id',currentUser.id).single());
  if(!p){toast('请选择关联商品','err');return}
  const pf=p.profit||0;
  const salePrice=parseFloat(get('sp'))||p.xianyu_price||0;
  const{error}=await safeQuery(()=>sb.from('orders').insert({
    user_id:currentUser.id,product_id:p.id,product_title:p.xianyu_title,
    buyer_name:bn,buyer_phone:phone,buyer_address:sanitize(get('ba'),200),
    sale_price:salePrice,profit:pf,status:'pending',
    source_url:p.source_url||'',source_platform:p.source_platform||'',
    logistics_company:'',logistics_no:''
  }));
  if(error){toast('创建失败','err');return}
  document.querySelector('.modal-overlay').remove();
  toast('订单已创建！','ok');loadOrd();
}

}

async function optimizeTitle(elId,forceTitle){
  const el=document.getElementById(elId);if(!el)return;
  const origTitle=forceTitle||el.dataset.title||'';
  if(!origTitle){el.innerHTML='<span style="color:#94a3b8">无标题可优化</span>';return}
  // 限频：3秒内不重复请求
  const now=Date.now();
  if(!forceTitle&&aiRequestedTitles.has(origTitle))return;
  if(now-lastAiRequest<AI_COOLDOWN){el.innerHTML='<span style="color:#94a3b8;font-weight:400">请求过快，请稍后再试</span>';return}
  aiRequestedTitles.add(origTitle);
  lastAiRequest=now;
  el.innerHTML='<span style="color:#94a3b8;font-weight:400">✨ 生成中...</span>';
  try{
    const res=await fetch('/.netlify/functions/optimize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:origTitle.slice(0,100)})});
    if(!res.ok)throw new Error('请求失败');
    const data=await res.json();
    const aiTitle=data.choices&&data.choices[0]&&data.choices[0].message?data.choices[0].message.content.trim():'';
    if(aiTitle)el.textContent=aiTitle.slice(0,60); // 限制AI输出长度
    else el.innerHTML='<span style="color:#ef4444">生成失败，点击重试</span>';
  }catch(e){el.innerHTML='<span style="color:#ef4444">网络错误，点击重试</span>'}
}

// ===== INIT: Check existing session =====
async function init(){
  const{data}=await sb.auth.getSession();
  if(data.session){
    currentUser=data.session.user;
    const{data:profile}=await safeQuery(()=>sb.from('profiles').select('*').eq('id',currentUser.id).single());
    if(profile&&!profile.is_banned){
      currentProfile=profile;
      showApp();
      // 同步 token 给 Chrome 插件（同源场景）
      syncTokenToExtension();
      return;
    }
    if(profile&&profile.is_banned){
      await sb.auth.signOut();
    }
  }
}

// 同步 Supabase token 到 Chrome 插件
async function syncTokenToExtension(){
  try{
    const{data}=await sb.auth.getSession();
    if(data.session&&data.session.access_token){
      // 通过 postMessage 给同源的 content script
      window.postMessage({
        type:'FISHFLOW_TOKEN',
        token:data.session.access_token
      },'*');
    }
  }catch(e){}
}

// 监听 Supabase auth 状态变化，自动同步 token
sb.auth.onAuthStateChange((event,session)=>{
  if(session&&session.access_token){
    window.postMessage({
      type:'FISHFLOW_TOKEN',
      token:session.access_token
    },'*');
  }
});

init();
